name: Build Android APK

on:
  push:
    branches: [ main, master, all_flutter ]
  pull_request:
    branches: [ main, master, all_flutter ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
        
    - name: Get dependencies
      working-directory: ./front
      run: flutter pub get
      
    - name: Remove gradle.properties if exists
      working-directory: ./front/android
      run: |
        rm -f gradle.properties
        rm -f local.properties
      continue-on-error: true
      
    - name: Clean build
      working-directory: ./front
      run: flutter clean
      
    - name: Build APK
      working-directory: ./front
      run: flutter build apk --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: front/build/app/outputs/flutter-apk/app-release.apk
